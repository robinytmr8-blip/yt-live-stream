name: YouTube + Facebook Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install gdown edge-tts

      - name: Download video
        run: gdown --fuzzy "https://drive.google.com/file/d/1eJyqZ_6jEE2OpAcqgsGcfoaYLa7I2K9o/view" -O raw.mp4

      - name: Make subscribe voice
        run: |
          edge-tts --voice en-US-AriaNeural \
            --text "If you like this video, please subscribe to my YouTube channel and press the bell icon." \
            --write-media voice.mp3
          ffmpeg -y -i voice.mp3 -af "apad=whole_dur=180" -ar 44100 -ac 2 voice_loop.wav

      - name: Prepare video
        run: |
          ffmpeg -y -i raw.mp4 -stream_loop -1 -i voice_loop.wav \
            -filter_complex "[0:v]scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,setsar=1,drawtext=text='Tania':fontcolor=white@0.8:fontsize=32:x=w-tw-20:y=30:shadowcolor=black:shadowx=2:shadowy=2,drawtext=text='Subscribe My YouTube Channel':fontcolor=white:fontsize=38:x=(w-tw)/2:y=h-th-90:box=1:boxcolor=black@0.45:boxborderw=14:shadowcolor=black:shadowx=2:shadowy=2[v];[0:a]loudnorm=I=-16:TP=-1.5:LRA=11[a0];[1:a]volume=0.9[a1];[a0][a1]amix=inputs=2:duration=first:normalize=0[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -crf 23 \
            -c:a aac -b:a 128k -ar 44100 \
            video.mp4

      - name: Stream to YouTube + Facebook
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
          FB_STREAM_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          END_TIME=$(( $(date +%s) + 340*60 ))
          RECONNECT_COUNT=0
          MAX_RECONNECTS=20

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ffmpeg -re -stream_loop -1 -i video.mp4 \
              -c:v libx264 -preset veryfast -r 30 \
              -b:v 3500k -maxrate 4500k -bufsize 7000k \
              -g 60 -keyint_min 60 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -ar 44100 \
              -map 0:v -map 0:a \
              -f tee "[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY|[f=flv:onfail=ignore]rtmps://live-api-s.facebook.com:443/rtmp/$FB_STREAM_KEY"

            NOW=$(date +%s)
            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "Time limit reached, stopping normally."
              break
            fi

            RECONNECT_COUNT=$((RECONNECT_COUNT + 1))
            if [ "$RECONNECT_COUNT" -gt "$MAX_RECONNECTS" ]; then
              echo "Too many reconnects, stopping."
              break
            fi

            echo "Stream disconnected, reconnecting in 5s (attempt $RECONNECT_COUNT)..."
            sleep 5
          done
