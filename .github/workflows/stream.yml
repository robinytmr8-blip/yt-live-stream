name: YouTube + Facebook Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Start time
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install gdown

      - name: Download video
        run: gdown 1-6dr_tzvCa1KerSiMjaXZEx32iyEIDf4 -O raw.mp4

      - name: Prepare HD shorts video
        run: |
          # video-te audio na thakle nishobdo audio joga hobe
          if [ -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 raw.mp4)" ]; then
            ffmpeg -y -i raw.mp4 -f lavfi -i anullsrc=r=44100:cl=stereo \
              -c:v copy -c:a aac -shortest raw_a.mp4
            mv raw_a.mp4 raw.mp4
          fi

          ffmpeg -y -i raw.mp4 \
            -filter_complex "[0:v]fps=30,split=2[bg][fg];[bg]scale=270:480:force_original_aspect_ratio=increase,crop=270:480,boxblur=8:2,scale=1080:1920[b];[fg]scale=1080:1920:force_original_aspect_ratio=decrease[f];[b][f]overlay=(W-w)/2:(H-h)/2,setsar=1,format=yuv420p[v]" \
            -map "[v]" -map 0:a \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:v libx264 -preset veryfast -profile:v high \
            -b:v 4000k -maxrate 4500k -bufsize 8000k \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 160k -ar 44100 \
            video.mp4

          # flv-te remux, jate stream-e encode na lage
          ffmpeg -y -i video.mp4 -c copy video.flv

      - name: Stream to YouTube + Facebook
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
          FB_STREAM_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          END_TIME=$(( JOB_START + 345*60 ))
          RECONNECT_COUNT=0
          MAX_RECONNECTS=20

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ffmpeg -re -stream_loop -1 -i video.flv \
              -c copy -map 0:v -map 0:a \
              -f tee "[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY|[f=flv:onfail=ignore]rtmps://live-api-s.facebook.com:443/rtmp/$FB_STREAM_KEY" || true

            NOW=$(date +%s)
            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "Time limit reached, stopping normally."
              break
            fi

            RECONNECT_COUNT=$((RECONNECT_COUNT + 1))
            if [ "$RECONNECT_COUNT" -gt "$MAX_RECONNECTS" ]; then
              echo "Too many reconnects, stopping."
              break
            fi

            echo "Stream disconnected, reconnecting in 5s (attempt $RECONNECT_COUNT)..."
            sleep 5
          done
