name: YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install gdown

      - name: Download video
        run: gdown 1ppubB4jDMz2hvlLG2ATLC0HA96jp_9B3 -O raw.mp4

      - name: Prepare video
        run: |
          ffmpeg -y -i raw.mp4 \
            -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,setsar=1,drawtext=text='Tania':fontcolor=white@0.8:fontsize=32:x=w-tw-20:y=h-th-30:shadowcolor=black:shadowx=2:shadowy=2" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:v libx264 -preset veryfast -crf 23 \
            -c:a aac -b:a 128k -ar 44100 \
            video.mp4

      - name: Stream to YouTube (with auto-reconnect)
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          END_TIME=$(( $(date +%s) + 340*60 ))
          RECONNECT_COUNT=0
          MAX_RECONNECTS=20

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ffmpeg -re -stream_loop -1 -i video.mp4 \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -c:v libx264 -preset veryfast \
              -b:v 3500k -maxrate 4500k -bufsize 7000k \
              -g 60 -keyint_min 60 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY

            NOW=$(date +%s)
            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "Time limit reached, stopping normally."
              break
            fi

            RECONNECT_COUNT=$((RECONNECT_COUNT + 1))
            if [ "$RECONNECT_COUNT" -gt "$MAX_RECONNECTS" ]; then
              echo "Too many reconnects, stopping."
              break
            fi

            echo "Stream disconnected, reconnecting in 5s (attempt $RECONNECT_COUNT)..."
            sleep 5
          done
