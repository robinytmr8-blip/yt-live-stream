name: YouTube Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install gdown

      - name: Download video
        run: gdown 1CJbmFWKQC_SXN48levb3Ye5NRSh-0JCl -O raw.mp4

      - name: Prepare vertical video
        run: |
          ffmpeg -y -i raw.mp4 \
            -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,setsar=1,drawtext=text='Tania':fontcolor=white@0.8:fontsize=32:x=w-tw-20:y=h-th-30:shadowcolor=black:shadowx=2:shadowy=2" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:v libx264 -preset veryfast -b:v 3500k -maxrate 4500k -bufsize 7000k \
            -r 30 -g 60 -keyint_min 60 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            video_v.mp4

      - name: Prepare horizontal video
        run: |
          ffmpeg -y -i raw.mp4 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,drawtext=text='Tania':fontcolor=white@0.8:fontsize=28:x=w-tw-20:y=h-th-30:shadowcolor=black:shadowx=2:shadowy=2" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:v libx264 -preset veryfast -b:v 3500k -maxrate 4500k -bufsize 7000k \
            -r 30 -g 60 -keyint_min 60 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            video_h.mp4

      - name: Stream to YouTube (both)
        env:
          KEY_V: ${{ secrets.STREAM_KEY_VERTICAL }}
          KEY_H: ${{ secrets.STREAM_KEY_HORIZONTAL }}
        run: |
          END_TIME=$(( $(date +%s) + 340*60 ))
          RECONNECT_COUNT=0
          MAX_RECONNECTS=20

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ffmpeg -re -stream_loop -1 -i video_v.mp4 \
                   -re -stream_loop -1 -i video_h.mp4 \
              -map 0 -c copy -f flv rtmp://a.rtmp.youtube.com/live2/$KEY_V \
              -map 1 -c copy -f flv rtmp://a.rtmp.youtube.com/live2/$KEY_H

            NOW=$(date +%s)
            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "Time limit reached, stopping normally."
              break
            fi

            RECONNECT_COUNT=$((RECONNECT_COUNT + 1))
            if [ "$RECONNECT_COUNT" -gt "$MAX_RECONNECTS" ]; then
              echo "Too many reconnects, stopping."
              break
            fi

            echo "Stream disconnected, reconnecting in 5s (attempt $RECONNECT_COUNT)..."
            sleep 5
          done
