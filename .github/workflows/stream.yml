name: YouTube + Facebook Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install gdown edge-tts

      - name: Download video
        run: gdown 1eJyqZ_6jEE2OpAcqgsGcfoaYLa7I2K9o -O raw.mp4

      - name: Make subscribe voice (every 60s)
        run: |
          edge-tts --voice en-US-AriaNeural --rate=-8% \
            --text "Hey friends! If you are enjoying this live stream, please subscribe to my YouTube channel, and press the bell icon. Thank you!" \
            --write-media voice.mp3
          ffmpeg -y -i voice.mp3 \
            -af "loudnorm=I=-14:TP=-1.5:LRA=7,aresample=44100,adelay=8000:all=1,apad=whole_dur=60" \
            -ac 2 voice_loop.wav

      - name: Prepare video
        run: |
          # video-te audio na thakle nishobdo audio joga hobe
          if [ -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 raw.mp4)" ]; then
            ffmpeg -y -i raw.mp4 -f lavfi -i anullsrc=r=44100:cl=stereo \
              -c:v copy -c:a aac -shortest raw_a.mp4
            mv raw_a.mp4 raw.mp4
          fi

          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw.mp4)
          ffmpeg -y -stream_loop -1 -i voice_loop.wav -t "$DUR" voice_full.wav

          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -y -i raw.mp4 -i voice_full.wav \
            -filter_complex "[0:v]fps=30,scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,setsar=1,drawtext=fontfile=$FONT:text='Tania':fontcolor=white@0.8:fontsize=32:x=w-tw-20:y=30:shadowcolor=black:shadowx=2:shadowy=2,drawtext=fontfile=$FONT:text='Subscribe My YouTube Channel':fontcolor=white:fontsize=38:x=(w-tw)/2:y=h-th-90:box=1:boxcolor=black@0.45:boxborderw=14:shadowcolor=black:shadowx=2:shadowy=2[v];[0:a]loudnorm=I=-16:TP=-1.5:LRA=11,aresample=44100,aformat=channel_layouts=stereo[music];[1:a]asplit=2[sc][vo];[music][sc]sidechaincompress=threshold=0.03:ratio=5:attack=50:release=600[duck];[duck][vo]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -crf 23 \
            -c:a aac -b:a 128k -ar 44100 \
            -shortest video.mp4

      - name: Stream to YouTube + Facebook
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
          FB_STREAM_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          END_TIME=$(( $(date +%s) + 340*60 ))
          RECONNECT_COUNT=0
          MAX_RECONNECTS=20

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ffmpeg -re -stream_loop -1 -i video.mp4 \
              -c:v libx264 -preset veryfast -r 30 \
              -b:v 3500k -maxrate 4500k -bufsize 7000k \
              -g 60 -keyint_min 60 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -ar 44100 \
              -map 0:v -map 0:a -flags +global_header \
              -f tee "[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY|[f=flv:onfail=ignore]rtmps://live-api-s.facebook.com:443/rtmp/$FB_STREAM_KEY"

            NOW=$(date +%s)
            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "Time limit reached, stopping normally."
              break
            fi

            RECONNECT_COUNT=$((RECONNECT_COUNT + 1))
            if [ "$RECONNECT_COUNT" -gt "$MAX_RECONNECTS" ]; then
              echo "Too many reconnects, stopping."
              break
            fi

            echo "Stream disconnected, reconnecting in 5s (attempt $RECONNECT_COUNT)..."
            sleep 5
          done
