name: YouTube Live Stream

on:
  workflow_dispatch:

# একই সময়ে দুটো স্ট্রিম চালু হতে দেবে না
concurrency:
  group: youtube-live-stream
  cancel-in-progress: true

env:
  DRIVE_FILE_ID: 1CJbmFWKQC_SXN48levb3Ye5NRSh-0JCl
  WATERMARK: Tania
  STREAM_MINUTES: 340

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q gdown

      - name: Download video
        run: |
          gdown "$DRIVE_FILE_ID" -O raw.mp4
          test -s raw.mp4 || { echo "ERROR: download failed. Check Drive sharing (Anyone with the link)."; exit 1; }

      - name: Prepare vertical video (9:16)
        run: |
          ffmpeg -nostdin -loglevel warning -y -i raw.mp4 \
            -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,setsar=1,drawtext=text='${WATERMARK}':fontcolor=white@0.8:fontsize=32:x=w-tw-20:y=h-th-30:shadowcolor=black:shadowx=2:shadowy=2" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:v libx264 -preset veryfast -b:v 3500k -maxrate 4500k -bufsize 7000k \
            -r 30 -g 60 -keyint_min 60 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            video_v.mp4

      - name: Prepare horizontal video (16:9)
        run: |
          ffmpeg -nostdin -loglevel warning -y -i raw.mp4 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,drawtext=text='${WATERMARK}':fontcolor=white@0.8:fontsize=28:x=w-tw-20:y=h-th-30:shadowcolor=black:shadowx=2:shadowy=2" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:v libx264 -preset veryfast -b:v 3500k -maxrate 4500k -bufsize 7000k \
            -r 30 -g 60 -keyint_min 60 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            video_h.mp4

      - name: Stream to YouTube (vertical + horizontal)
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          set -uo pipefail

          # STREAM_KEY = "verticalKey,horizontalKey"
          KEY_V=$(echo "$STREAM_KEY" | cut -d',' -f1 | tr -d ' \r\n')
          KEY_H=$(echo "$STREAM_KEY" | cut -d',' -f2 | tr -d ' \r\n')

          if [ -z "$KEY_V" ] || [ -z "$KEY_H" ]; then
            echo "ERROR: STREAM_KEY must be: verticalKey,horizontalKey"
            exit 1
          fi

          # ভাগ করা key গুলো লগে লুকানোর জন্য
          echo "::add-mask::$KEY_V"
          echo "::add-mask::$KEY_H"

          END_TIME=$(( $(date +%s) + STREAM_MINUTES*60 ))
          RECONNECTS=0
          MAX_RECONNECTS=20

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ffmpeg -nostdin -loglevel warning \
              -re -stream_loop -1 -i video_v.mp4 \
              -re -stream_loop -1 -i video_h.mp4 \
              -map 0 -c copy -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY_V" \
              -map 1 -c copy -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY_H"

            if [ "$(date +%s)" -ge "$END_TIME" ]; then
              echo "Time limit reached, stopping normally."
              break
            fi

            RECONNECTS=$((RECONNECTS + 1))
            if [ "$RECONNECTS" -gt "$MAX_RECONNECTS" ]; then
              echo "Too many reconnects, stopping."
              exit 1
            fi

            echo "Stream disconnected, reconnecting in 5s (attempt $RECONNECTS/$MAX_RECONNECTS)..."
            sleep 5
          done
